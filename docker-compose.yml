services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: chatws-rabbitmq
    ports:
      - "5672:5672"
      - "61613:61613"
      - "15672:15672"
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
      rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
